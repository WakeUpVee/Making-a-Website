<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Designs</title>
    <style>

        html, body {
            margin: 0;
            padding: 0;
        }


        body {
            background-image: url(img/bodybg.png);
            min-height: 100vh;

        }

        h1 {
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            text-align: center;
            padding: 5px;
            color: orange;
            height: 60px;
            padding: 12px 30px;
            font-size: 70px;
            margin: 0;
    
        }
        .container {
            text-align: center;
        }


        button {
            background-color: teal;
            border-radius: 30px;
            color: white;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            font-size: 30px;
            font-weight: bold;
            cursor: pointer;
            width: 200px;
            height: 100px;
            padding: 20px;
            
        }

        button:hover{
            background-color: orange;
        }

        div > form {
            text-align: center;
            margin: 20px;
        }

        input {
            padding: 12px 16px;
            font-size: 18px;
            width: 150px;
            border-radius: 6px;
            border: 2px solid #ccc;
            margin: 5px;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        .cvv {
            padding: 12px 16px;
            font-size: 18px;
            width: 50px;
            border-radius: 6px;
            border: 2px solid #ccc;
            margin: 1px;

        }
    </style>

</head>
<body>

    <h1 class = "container"> Welcome to Random Designs!</h1>
    

    <div>
    <form>
        <input name="Credit Card Digits" type ="text" placeholder = Digits>
        <input class="cvv" name="CVV" type="text" placeholder="CVV">

    </form>
    </div>

    <div class="container">
        <button>
            SUBMIT!
        </button>
    </div>


    
</body>
</html>
